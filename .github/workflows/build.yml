name: Build APK

on:
  push:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Préparer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing KEYSTORE_PASSWORD"
          [ -z "$TMDB_API_KEY" ] && missing="$missing TMDB_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Secrets introuvables :$missing (Settings > Secrets and variables > Actions > onglet Secrets > Repository secrets)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/nova-release.jks

      - name: Compiler l'APK
        env:
          ORG_GRADLE_PROJECT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace -PBUILD_NUMBER=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk NovaTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NovaTV-apk
          path: NovaTV.apk

      - name: Publier l'APK (lien fixe)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" NovaTV.apk \
            --title "Nova TV · version ${{ github.run_number }}" \
            --notes "APK prêt à installer. Lien fixe : https://github.com/${{ github.repository }}/releases/latest/download/NovaTV.apk" \
            --latest

      - name: Joindre l'APK à la release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" NovaTV.apk --clobber
