name: Build APK

on:
  push:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler l'APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace -PTMDB_API_KEY="${{ secrets.TMDB_API_KEY }}"
          cp app/build/outputs/apk/release/app-release.apk NovaTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NovaTV-apk
          path: NovaTV.apk

      - name: Joindre l'APK à la release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" NovaTV.apk --clobber
